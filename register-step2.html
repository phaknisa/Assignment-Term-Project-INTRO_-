<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครเรียน - ขั้นตอนที่ 2 (อัปโหลดไฟล์เอกสาร)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <img src="555.png" alt="KMUTNB Logo" class="logo-img">
        <h1>มหาวิทยาลัยเทคโนโลยีพระจอมเกล้าพระนครเหนือ</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">หน้าแรก</a></li>
            <li><a href="register-step1.html" class="active">สมัครเรียน</a></li>
            <li><a href="schedule.html">กำหนดการ</a></li>
            <li><a href="contact.html">ติดต่อ</a></li>
            <li><a href="login.html">เข้าสู่ระบบ</a></li>
        </ul>
    </nav>

    <div class="page-title-banner">สมัครเรียน</div>

    <div class="main-container">
        <div class="apply-container">
            <!-- Indicator บอกขั้นตอน -->
            <div class="step-indicator">
                <div class="step-item">1. ข้อมูลส่วนตัวและครอบครัว</div>
                <div class="step-item active">2. อัปโหลดไฟล์เอกสาร</div>
            </div>

            <form action="#" method="POST" onsubmit="alert('ส่งข้อมูลการสมัครเรียบร้อยแล้ว!'); return false;">
                <div class="form-section-title">ไฟล์เอกสารที่ต้องอัปโหลด</div>
                <div class="form-grid">
                    <label for="photo">รูปถ่ายหน้าตรง</label>
                    <input type="file" id="photo" class="form-control" accept="image/*" required>

                    <label for="id-copy">สำเนาบัตรประจำตัวประชาชน</label>
                    <input type="file" id="id-copy" class="form-control" accept=".pdf,image/*" required>

                    <label for="transcript">ใบระเบียนผลการเรียน (ปพ.1)</label>
                    <input type="file" id="transcript" class="form-control" accept=".pdf,image/*" required>
                </div>

                <div class="btn-group" style="margin-top: 40px;">
                    <a href="register-step1.html" class="btn btn-secondary">&laquo; ย้อนกลับ</a>
                    <button type="submit" class="btn btn-primary">ยืนยันการสมัครเรียน</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-col">
                <h4>ติดต่อ</h4>
                <p>..........<br>..........<br>..........</p>
            </div>
            <div class="footer-col">
                <h4>ติดตามข่าวสาร</h4>
                <p>..........<br>..........<br>..........</p>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
